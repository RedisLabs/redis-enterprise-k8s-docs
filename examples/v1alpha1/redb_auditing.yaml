apiVersion: app.redislabs.com/v1alpha1
kind: RedisEnterpriseDatabase
metadata:
  name: redb-auditing
  labels:
    app: redis-enterprise
spec:
  # Memory size of the database.
  memorySize: 256MB

  # Number of shards in the database.
  shardCount: 1

  # Database auditing configuration.
  # Note: the cluster-level auditing configuration (RedisEnterpriseCluster spec.auditing.config)
  # must be set before enabling auditing on a database.
  auditing:
    # Scope of database auditing.
    # One of: "disabled", "connection", "connection_and_crud".
    # "connection_and_crud" audits both connection/authentication events and data operations.
    auditMode: connection_and_crud

    # Optional: audit data operation events only for the listed usernames.
    usernameFilter:
      enabled: true
      filterType: inclusive
      usernames:
        - app-user
        - admin

    # Optional: audit data operation events only for the listed source IPs / CIDR ranges.
    sourceIpFilter:
      enabled: true
      filterType: inclusive
      ipAddresses:
        - 10.0.0.10
      cidrRanges:
        - 10.0.1.0/24
